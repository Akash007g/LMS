spring.application.name=lms-thymeleaf
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/lms?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

app.jwt.secret=change-this-secret-key-to-at-least-32-characters-long
app.jwt.expiration-ms=86400000

# Email. Keep false for local testing; OTP is printed in console.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
